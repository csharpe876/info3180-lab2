{% extends 'base.html' %}
{% block main %}
<div class="profile-card">
	<div class="profile-header">
		<img src="{{ url_for('static', filename='images/profile.jpg') }}" alt="Profile Photo" class="profile-photo">
		<h2 class="profile-name">Carl Sharpe</h2>
		<p class="profile-username">@carlsharpe</p>
		<p class="profile-location">Kingston, Jamaica</p>
		<p class="profile-joined">Joined February, 2026</p>
	</div>
	<div class="profile-bio">
		<p>I am a passionate web developer and designer. Let's connect if you want to collaborate on creative projects!</p>
	</div>
	<div class="profile-stats">
		<div class="stat">
			<span class="stat-number">12</span>
			<span class="stat-label">Posts</span>
		</div>
		<div class="stat">
			<span class="stat-number">80</span>
			<span class="stat-label">Following</span>
		</div>
		<div class="stat">
			<span class="stat-number">300</span>
			<span class="stat-label">Followers</span>
		</div>
	</div>
	<div class="profile-action">
		<button class="follow-btn">Follow</button>
	</div>
</div>
{% endblock %}
